name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Cross-compile Kernel
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q \
            gcc-i686-linux-gnu binutils-i686-linux-gnu \
            nasm qemu-system-x86 grub-pc-bin xorriso mtools

      - name: Build kernel ELF
        run: |
          make CC=i686-linux-gnu-gcc LD=i686-linux-gnu-gcc

      - name: Verify ELF
        run: |
          file corekernel.elf
          i686-linux-gnu-objdump -h corekernel.elf

      - name: Smoke test in QEMU (5 seconds)
        run: |
          timeout 5 qemu-system-i386 \
            -kernel corekernel.elf \
            -nographic \
            -serial mon:stdio \
            -m 128M \
            -no-reboot || true

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: corekernel-elf
          path: corekernel.elf
          retention-days: 14
